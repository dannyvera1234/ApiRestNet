services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserverdata:/var/opt/mssql
volumes:
  sqlserverdata:
# Comandos útiles:
# Levantar los contenedores en segundo plano:
#   docker-compose up -d
# Apagar y eliminar contenedores (no borra los volúmenes):
#   docker-compose down
# Apagar y eliminar contenedores y volúmenes:
#   docker-compose down --volumes
# Ver logs de los contenedores:
#   docker-compose logs 
# Ver logs de los contenedores en tiempo real:
#   docker-compose logs -f
# Ver el estado de los contenedores:
#   docker-compose ps
# Ver el estado de los contenedores en tiempo real:
#   docker-compose ps -f
# Ver el estado de los volúmenes:
#   docker volume ls
# 1. Crear migración para TODOS los cambios
# dotnet ef migrations add UpdateAllModels

# 2. Aplicar TODOS los cambios a la base de datos
# dotnet ef database update
